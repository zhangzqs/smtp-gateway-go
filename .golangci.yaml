version: "2"

# 以官方 standard 为基线，参考 https://github.com/maratori/golangci-lint-config
# 检查正确性、现代 Go 写法与库用法；需要语义判断的契约由设计和回归测试约束。

run:
  timeout: 15m
  tests: true
  # 并发度使用默认值，自动匹配容器 CPU 配额或机器逻辑 CPU 数。
  relative-path-mode: gomod

linters:
  # standard 隐式启用以下检查：
  # errcheck：检查未处理的 error 返回值。
  # govet：检查格式化参数、锁复制等可疑代码。
  # ineffassign：检查赋值后未被使用就再次覆盖的变量。
  # staticcheck：检查常见缺陷、废弃 API 和代码风格问题。
  # unused：检查未使用的常量、变量、函数和类型。
  default: standard
  settings:
    embeddedstructfieldcheck:
      # 禁止匿名嵌入 mutex，避免向外暴露 Lock / Unlock 方法。
      forbid-mutex: true
    errcheck:
      # 类型断言也必须检查是否成功。
      check-type-assertions: true
      # 允许用 _ 明确忽略错误，例如容错解析和测试响应写入。
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic # 启用诊断类检查，发现可疑表达式和控制流。
    gomoddirectives:
      # Go 版本与 go.mod 保持一致。
      go-version-pattern: '^1\.27\.2$'
    govet:
      # standard 启用了 govet，但下面这些分析器需要额外开启。
      enable:
        - atomicalign # 检查 32 位平台上 64 位原子操作的内存对齐。
        - deepequalerrors # 避免用 reflect.DeepEqual 比较 error。
        - httpmux # 检查 http.ServeMux 路由模式与模块 Go 版本是否兼容。
        - nilness # 根据控制流发现 nil 解引用和无效的 nil 比较。
        - reflectvaluecompare # 避免用 == 或 reflect.DeepEqual 比较 reflect.Value。
        - sortslice # 检查 sort.Slice 等函数是否收到有效的切片参数。
        - unusedwrite # 检查未被使用的结构体字段和数组元素写入。
    nakedret:
      # defer 确需使用命名结果时，也必须显式列出返回值。
      max-func-lines: 0
    nonamedreturns:
      # 允许 defer 读取或修改最终 error；其他必要场景在使用处说明原因。
      report-error-in-defer: false
    nolintlint:
      # nolint 必须指定具体 linter，并说明忽略原因。
      require-specific: true
      require-explanation: true
    testifylint:
      enable-all: true
    revive:
      enable-default-rules: false
      rules:
        - name: context-as-argument # context.Context 应作为第一个参数。
        - name: context-keys-type # context key 避免使用普通字符串等基本类型。
        - name: error-return # error 应位于返回值列表的最后。
  enable:
    - asasalint # 传递 []any 给 ...any 参数时，检查是否遗漏 ... 展开。
    - asciicheck # 标识符只使用 ASCII，避免难以辨认的名称。
    - bidichk # 检查可能伪装代码顺序的 Unicode 双向控制字符。
    - bodyclose # 检查 HTTP 响应 body 是否关闭，避免资源泄漏。
    - canonicalheader # HTTP header 名称使用标准的大小写形式。
    - containedctx # 避免把 context.Context 保存在结构体字段中。
    - contextcheck # 检查下游是否继承当前 context，避免丢失取消等信息。
    - copyloopvar # 移除现代 Go 中不再需要的循环变量复制。
    - durationcheck # 检查两个 time.Duration 相乘造成的单位错误。
    - embeddedstructfieldcheck # 匿名嵌入字段置于顶部并与普通字段分隔，禁止嵌入 mutex。
    - errname # 哨兵错误以 Err 开头，错误类型以 Error 结尾。
    - errorlint # 检查包装错误的比较、类型判断和格式化是否正确。
    - exhaustive # 检查枚举 switch 是否覆盖所有取值。
    - exptostd # 已进入标准库的功能不再使用 golang.org/x/exp 实现。
    - fatcontext # 检查循环和闭包中不必要地逐层派生 context。
    - gocheckcompilerdirectives # 检查 //go: 编译器指令的格式和有效性。
    - gochecksumtype # 检查标记为 sum type 的接口在类型分支中是否完整覆盖。
    - gocritic # 检查常见缺陷及可疑写法，补充正确性和简化建议。
    - gomoddirectives # 约束 go.mod 的 Go 版本及 replace 等指令。
    - goprintffuncname # 接收 printf 格式字符串的函数名以 f 结尾。
    - gosec # 检查弱随机数、危险转换、敏感数据等安全问题。
    - iface # 检查接口误用和不必要的接口定义。
    - iotamixing # 避免在同一 const 块混用 iota 和普通常量。
    - makezero # 检查先创建非零长度切片再 append 等易产生多余元素的写法。
    - mirror # 检查 bytes / strings API 的混用和不必要的类型转换。
    - misspell # 检查注释等文本中的常见英文拼写错误。
    - modernize # 使用现代 Go 语言和标准库功能简化旧写法。
    - nakedret # 禁止裸 return，始终显式列出返回值。
    - nilerr # 避免在已确认 err 非 nil 的分支中返回 nil 错误。
    - nilnesserr # 避免检查非 nil 错误后却返回另一个已知为 nil 的错误。
    - nilnil # 避免同时返回无效结果和 nil 错误。
    - noctx # 检查支持 context 的调用是否使用了带 context 的版本。
    - nonamedreturns # 默认不使用具名返回值，保留配置允许的 defer 场景。
    - nolintlint # nolint 必须格式正确、指定 linter 并说明原因。
    - nosprintfhostport # 主机和端口使用 net.JoinHostPort 拼接，正确处理 IPv6。
    - perfsprint # 简单转换优先使用 strconv 等，避免不必要的 fmt.Sprintf。
    - predeclared # 避免变量等声明遮蔽 len、error 等预声明标识符。
    - recvcheck # 同一类型的方法保持指针或值 receiver 风格一致。
    - revive # 执行配置中的 context 参数、context key 和 error 返回位置约定。
    - testableexamples # 示例函数提供预期输出，使 go test 能验证示例行为。
    - thelper # 测试辅助函数调用 t.Helper 等方法，正确定位失败位置。
    - tparallel # 检查 t.Parallel 在父测试和子测试中的使用是否合理。
    - unconvert # 移除不必要的类型转换。
    - unparam # 检查未使用或始终接收相同值的函数参数。
    - usestdlibvars # 可用标准库常量时，避免重复写状态码、方法名等字面量。
    - usetesting # 测试优先使用 t.Context、t.Setenv、t.TempDir 等测试专用方法。
    - wastedassign # 检查永远不会被读取的冗余赋值。

    # 第三方库用法。
    - testifylint # 检查 testify 断言的使用方式和常见误用。
  exclusions:
    warn-unused: true
    rules:
      # 测试可以捕获 context 供断言，不代表生产对象可以长期保存 context。
      - path: _test\.go$
        linters:
          - containedctx
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt # 使用比 gofmt 更严格且兼容的统一格式。
    - goimports # 整理 import 分组，并增删实际使用的导入。

  settings:
    goimports:
      local-prefixes:
        - github.com/zhangzqs/smtp-gateway-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
